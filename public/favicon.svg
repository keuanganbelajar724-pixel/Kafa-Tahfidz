<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Crescent & Star at Top Center -->
  <g transform="translate(256, 130) scale(1.1)" filter="url(#shadow)">
    <!-- Crescent Moon -->
    <path d="M 0,-45 A 45,45 0 1,0 45,0 A 35,35 0 1,1 -5,-40 A 45,45 0 0,0 0,-45 Z" fill="url(#goldGrad)" />
    <!-- 8-point Islamic Star -->
    <path d="M 12,-18 L 16,-10 L 25,-10 L 18,-4 L 21,5 L 12,0 L 4,5 L 7,-4 L 0,-10 L 9,-10 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Open Holy Quran (Rehal / Mushaf) -->
  <g transform="translate(256, 310)" filter="url(#shadow)">
    <!-- Wooden Rehal / Bookstand base -->
    <path d="M -150,110 L -40,30 L 40,30 L 150,110 L 110,125 L 0,55 L -110,125 Z" fill="#b45309" opacity="0.9" />
    <path d="M -110,125 L 0,55 L 110,125 L 90,135 L 0,70 L -90,135 Z" fill="#78350f" />

    <!-- Left Page -->
    <path d="M -10,35 C -50,30 -120,10 -150,-35 C -150,-40 -140,-45 -130,-45 C -90,-20 -40,5 -10,15 Z" fill="url(#pageGrad)" stroke="#cbd5e1" stroke-width="2" />
    <!-- Left Page Top Layer -->
    <path d="M -10,20 C -50,15 -115,-5 -145,-48 C -145,-52 -135,-55 -125,-55 C -85,-30 -38,-5 -10,0 Z" fill="#ffffff" />
    <!-- Left Page Text Lines -->
    <line x1="-120" y1="-30" x2="-35" y2="-10" stroke="#059669" stroke-width="5" stroke-linecap="round" opacity="0.6" />
    <line x1="-110" y1="-15" x2="-35" y2="2" stroke="#059669" stroke-width="5" stroke-linecap="round" opacity="0.6" />
    <line x1="-100" y1="0" x2="-35" y2="14" stroke="#059669" stroke-width="5" stroke-linecap="round" opacity="0.6" />

    <!-- Right Page -->
    <path d="M 10,35 C 50,30 120,10 150,-35 C 150,-40 140,-45 130,-45 C 90,-20 40,5 10,15 Z" fill="url(#pageGrad)" stroke="#cbd5e1" stroke-width="2" />
    <!-- Right Page Top Layer -->
    <path d="M 10,20 C 50,15 115,-5 145,-48 C 145,-52 135,-55 125,-55 C 85,-30 38,-5 10,0 Z" fill="#ffffff" />
    <!-- Right Page Text Lines -->
    <line x1="35" y1="-10" x2="120" y2="-30" stroke="#059669" stroke-width="5" stroke-linecap="round" opacity="0.6" />
    <line x1="35" y1="2" x2="110" y2="-15" stroke="#059669" stroke-width="5" stroke-linecap="round" opacity="0.6" />
    <line x1="35" y1="14" x2="100" y2="0" stroke="#059669" stroke-width="5" stroke-linecap="round" opacity="0.6" />

    <!-- Golden Ribbon Marker -->
    <path d="M -5,10 C -2,50 15,75 25,95 L 10,95 L 0,80 L -10,95 L -15,95 C -5,75 -2,50 -5,10 Z" fill="url(#goldGrad)" />
  </g>
</svg>
